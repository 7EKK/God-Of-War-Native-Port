# Status map data (docs/status-map/map.svg and detail.md). After editing, regenerate with:
#   python tools/status_map.py
# (the GitHub action "Status map" also does it on every push to main).
#
# state: "native"  = done, runs as native code / native service, verified
#        "partial" = works, but part of it is still a hardware model, unverified or slow
#        "pending" = not done (missing, skipped or still emulated)
# weight: relative size of the box (rough share of the work / code involved).

[[panel]]
title = "PS2 hardware → native code"

