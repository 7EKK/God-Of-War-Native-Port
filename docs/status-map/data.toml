# Status map data (docs/status-map/map.svg and detail.md). After editing, regenerate with:
#   python tools/status_map.py
# (the GitHub action "Status map" also does it on every push to main).
#
# state: "ok"      = works, native, verified
#        "partial" = works, but part of it is still a hardware model, unverified or slow
#        "pending" = not done (missing, skipped or still emulated)

# ---------------------------------------------------------------------------------------------------------
# Panel 1: the static Sony SDK libraries linked into SCUS_973.99. Each recompiled function is one cell.
# `functions` = number of functions of the library in the recompiled output (port/output-usa, address range
# 0x0026F228-0x0029BBA4, library start addresses as in KIexster's god-of-war-recomp status data); entries with
# the same name are drawn as one library.
# ---------------------------------------------------------------------------------------------------------
