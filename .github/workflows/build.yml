name: Windows x64 development tools (not a playable game)

on:
  push:
    branches: [runtime]
  pull_request:
    branches: [runtime]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-development:
    name: Build native libraries, recompiler, analyzer and launcher
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: lukka/get-cmake@latest

      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Checkout launcher sources from main
        uses: actions/checkout@v6
        with:
          ref: main
          path: port-main
          sparse-checkout: tools/pc_release

      - name: Compile Windows launcher
        shell: cmd
        run: |
          if not exist compiled mkdir compiled
          pushd port-main\tools\pc_release
          rc /nologo /fo "%GITHUB_WORKSPACE%\compiled\launcher.res" launcher.rc
          if errorlevel 1 exit /b 1
          popd
          cl /nologo /std:c++17 /O2 /MT /EHsc /DUNICODE /D_UNICODE port-main\tools\pc_release\launcher.cpp port-main\tools\pc_release\import_ui.cpp port-main\tools\pc_release\disc_import.cpp compiled\launcher.res /Fe:"%GITHUB_WORKSPACE%\compiled\God of War.exe" /link /SUBSYSTEM:WINDOWS user32.lib gdi32.lib comdlg32.lib shell32.lib ole32.lib comctl32.lib
          if errorlevel 1 exit /b 1

      # The public repository does not contain the generated 6,482 game
      # functions, including ps2_recompiled_functions.h. Building
      # ps2EntryRunner here would always fail (or ship a non-playing stub).
      # The legacy ps2xTest suite is also out of sync with the native DMA
      # refactor. Compile only the concrete, source-complete targets.
      - name: Configure available native sources (MSVC x64)
        shell: pwsh
        run: >
          cmake -S . -B build -A x64
          -DPS2X_BUILD_RECOMP=ON
          -DPS2X_BUILD_ANALYZER=ON
          -DPS2X_BUILD_RUNTIME=ON
          -DPS2X_BUILD_TEST=OFF
          -DPS2X_BUILD_STUDIO=OFF

      - name: Build development binaries and libraries
        shell: pwsh
        run: cmake --build build --config Release --parallel 4 --target ps2_recomp ps2_analyzer ps2_runtime ps2_iop

      - name: Verify all expected outputs
        shell: pwsh
        run: |
          $expected = @(
            'compiled/God of War.exe',
            'build/ps2xRecomp/Release/ps2_recomp.exe',
            'build/ps2xAnalyzer/Release/ps2_analyzer.exe',
            'build/ps2xRuntime/Release/ps2_runtime.lib',
            'build/ps2xIOP/Release/ps2_iop.lib'
          )
          foreach ($file in $expected) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Missing build output: $file"
            }
            Write-Host "Verified: $file"
          }

      - name: Label development artifact clearly
        shell: pwsh
        run: |
          @'
          Windows x64 DEVELOPMENT TOOLS ONLY — NOT A PLAYABLE GOD OF WAR BUILD.

          Compiled components:
          - God of War.exe: first-run ISO/extracted-folder importer and launcher UI
            (cannot play until bin/GodOfWar.exe has been built separately)
          - ps2_recomp.exe: PS2 static recompiler
          - ps2_analyzer.exe: executable analyzer
          - ps2_runtime.lib and ps2_iop.lib: native host/IOP libraries

          What is missing:
          - Recompiled game-specific C++ generated from your own SCUS_973.99
          - ps2_recompiled_functions.h and related generated sources
          - Linked game runner (bin/GodOfWar.exe)
          - Extracted original PS2 disc data

          No game disc files are included. Do not treat this as a player release.
          A self-contained player release requires a separate, complete
          game-specific build and a first-run game-data importer.
          '@ | Set-Content -Encoding UTF8 compiled/README-DEVELOPMENT.txt

      - name: Upload verified Windows x64 development components
        uses: actions/upload-artifact@v6
        with:
          name: God-Of-War-Windows-x64-Development-Only
          if-no-files-found: error
          path: |
            compiled/God of War.exe
            compiled/README-DEVELOPMENT.txt
            build/ps2xRecomp/Release/ps2_recomp.exe
            build/ps2xAnalyzer/Release/ps2_analyzer.exe
            build/ps2xRuntime/Release/ps2_runtime.lib
            build/ps2xIOP/Release/ps2_iop.lib
